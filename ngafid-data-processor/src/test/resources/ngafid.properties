# Fallback test configuration for the ngafid-data-processor unit tests.
#
# The surefire config points ngafid.config.file at the repo-root ngafid.properties
# first (so local runs with real data/terrain use that); this classpath file is the
# fallback when that root file is absent -- notably in CI, where only the config-free
# unit tests run. The terrain altitude tests (tag "terrain") need the large SRTM data
# set and are excluded by default, so the placeholder paths below are never read: they
# exist only so org.ngafid.core.Config can initialize.
ngafid.airports.file=target/test-data/airports.csv
ngafid.runways.file=target/test-data/runways.csv
ngafid.upload.dir=target/test-data/uploads
ngafid.archive.dir=target/test-data/archive
ngafid.static.dir=target/test-data/static
ngafid.terrain.dir=target/test-data/terrain
ngafid.db.info=target/test-data/db-info.properties
ngafid.kafka.config.file=target/test-data/kafka.properties
ngafid.email.info=target/test-data/email.properties
ngafid.admin.emails=test@ngafid.org
ngafid.log.properties.file=target/test-data/log.properties
ngafid.use.maria.db=false
ngafid.email.enabled=false
