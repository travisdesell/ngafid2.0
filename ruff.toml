# Repo-wide Python lint configuration (ruff).
#
# Mirrors ngafid-pydata/pyproject.toml's ruleset so every Python file in the
# monorepo is linted the same way. Files under ngafid-pydata/ are governed by
# that package's own pyproject.toml (ruff uses the nearest config); this file
# governs the rest -- ngafid-chart-processor, ngafid-validate, and any future
# standalone scripts outside ngafid-pydata.
#
# target-version is py310 to match ngafid-pydata; the standalone scripts are
# assumed to run on Python 3.10+. Modernized files also carry
# `from __future__ import annotations` so the new annotation syntax stays valid
# even if a script is run on an older interpreter.
line-length = 120
target-version = "py310"

# .claude/ holds Claude Code agent tooling (hooks), not shipped project source.
extend-exclude = [".claude"]

[lint]
# pycodestyle (E/W), pyflakes (F), isort (I), pyupgrade (UP), flake8-bugbear (B).
select = ["E", "F", "W", "I", "UP", "B"]
