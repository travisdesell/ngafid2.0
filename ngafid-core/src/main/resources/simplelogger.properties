# slf4j-simple configuration for the third-party libraries that log through SLF4J
# (Testcontainers, Liquibase, Kafka, HikariCP, Javalin/Jetty, ...). NGAFID's own
# code logs through java.util.logging, configured in resources/log.properties.
#
# Default WARN, matching the java.util.logging default, so library chatter does
# not grow production logs. A -Dorg.slf4j.simpleLogger.defaultLogLevel=<level>
# system property overrides this (scripts/test.sh --log-level sets it for tests).
org.slf4j.simpleLogger.defaultLogLevel=warn
