# Verifies the whole Maven build compiles and the deployable assembly jars
# (the jar-with-dependencies artifacts each Dockerfile copies out of target/)
# package successfully. Tests are intentionally skipped here -- the separate
# "Test" workflow (scripts/test.sh) runs the unit tests -- so this only covers
# the compile + package phases that `mvn test` never reaches.
name: Build Jars

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: "temurin"

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Setup DAT2CSV
        run: run/setup_dat_importing

      - name: Build
        run: run/build

      - name: Package
        run: run/package
