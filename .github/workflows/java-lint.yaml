name: Lint

# Blocking PR gate. Runs scripts/lint.sh -- the SAME checks developers run locally
# -- so local == CI. It covers every language in the repo: Java (Spotless +
# Checkstyle), Kotlin, Python (ruff), JS/TS/CSS (ESLint + Prettier), HTML
# templates (djLint), Bash (shfmt + shellcheck), YAML (yamllint), Markdown
# (markdownlint), and Dockerfiles (hadolint). The script skips any check whose
# toolchain is missing, so every tool it relies on is installed below.
#
# (This replaces the previous GitHub Super-Linter setup; scripts/lint.sh is a
# superset of what that checked. The file keeps its name so the required
# "Lint" status check stays stable for branch protection.)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24" # match ngafid-frontend's engines (node >= 24)
          cache: npm
          cache-dependency-path: ngafid-frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python linters (ruff, yamllint, djlint)
        # djlint is pinned: its formatter/rules change between minor versions
        # (e.g. 1.46 added H053/H025 and reflowed tags), so an unpinned install
        # would drift from what developers run locally. Keep in sync with the venv.
        run: pip install ruff yamllint djlint==1.46.4

      - name: Install shell and Dockerfile linters (shellcheck, shfmt, hadolint)
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          SHFMT_VERSION=v3.10.0
          sudo curl -fsSL -o /usr/local/bin/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          sudo chmod +x /usr/local/bin/shfmt
          HADOLINT_VERSION=v2.12.0
          sudo curl -fsSL -o /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          sudo chmod +x /usr/local/bin/hadolint

      - name: Install frontend dependencies
        working-directory: ngafid-frontend
        run: npm ci

      - name: Install DAT2CSV dependency (needed to resolve the Maven build)
        run: >-
          mvn -B -ntp install:install-file -Dfile=resources/DAT2CSV-1.0.jar
          -DgroupId=org.ngafid -DartifactId=dat2csv -Dpackaging=jar -Dversion=1.0

      - name: Run scripts/lint.sh (fails on any problem)
        run: bash scripts/lint.sh

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: lint-reports/
          retention-days: 14
