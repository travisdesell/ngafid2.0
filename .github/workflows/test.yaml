name: Test

# Blocking PR gate. Runs scripts/test.sh -- the SAME unit tests developers run
# locally -- so local == CI. It covers the Java/Kotlin modules (Maven: ngafid-core
# via Testcontainers MySQL, ngafid-www, ngafid-data-processor, ...) and the Python
# tooling (pytest in ngafid-pydata). The Selenium end-to-end tests (tag "e2e") and
# the TerrainCache altitude tests (tag "terrain") are excluded here because they
# need a running server/browser and the large out-of-repo terrain data; run them
# locally with `scripts/test.sh --e2e` / `--terrain` (see CONTRIBUTING.md).
#
# ngafid-core's tests start a throwaway MySQL with Testcontainers, which needs a
# Docker engine; ubuntu-latest ships one, so no extra setup is required here.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ngafid-pydata (with test dependencies)
        run: pip install './ngafid-pydata[dev]'

      - name: Install DAT2CSV dependency (needed to resolve the Maven build)
        run: >-
          mvn -B -ntp install:install-file -Dfile=resources/DAT2CSV-1.0.jar
          -DgroupId=org.ngafid -DartifactId=dat2csv -Dpackaging=jar -Dversion=1.0

      - name: Run scripts/test.sh (fails on any test failure)
        run: bash scripts/test.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: test-reports/
          retention-days: 14
